<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGỌC HUYỀN — The Universe I Call You</title>
<meta name="theme-color" content="#08060B">
<!-- Font ngoài là tùy chọn: mất mạng thì tự dùng font dự phòng -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ob:#08060B;--pl:#1C1025;--bu:#4A1735;--rose:#EBA1C2;--ch:#F8DDE7;--st:#FFF6FB;--am:#9D70CE;--gold:#E6CDA3;
--disp:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hand:"Dancing Script","Segoe Script","Brush Script MT",cursive}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ob);color:var(--st);font:300 clamp(16px,1vw + 12px,18px)/1.8 var(--sans);overflow-x:hidden;min-height:100svh}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .45s}#dim.on{opacity:.55}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--rose),var(--am));z-index:45}
.disp{font-family:var(--disp);font-weight:600;letter-spacing:.06em}
.hand{font-family:var(--hand);font-weight:500}
.big{font:italic 500 clamp(1.9rem,5.6vw,3.7rem)/1.25 var(--disp);max-width:20ch;color:var(--st)}
.lead{font-family:var(--disp);font-style:italic;font-size:clamp(1.2rem,3vw,1.7rem);color:var(--ch);max-width:30ch}
.para{max-width:36rem;color:var(--ch)}.small{font-size:.85rem;opacity:.75}
.btn{font:500 1rem var(--sans);color:#1C1025;background:linear-gradient(120deg,var(--rose),var(--am));border:1px solid rgba(255,246,251,.55);border-radius:99px;padding:.9rem 1.7rem;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 10px 34px rgba(157,112,206,.35);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(235,161,194,.45)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ch);border-color:rgba(235,161,194,.5);box-shadow:none}
.btn.big2{font-size:clamp(1rem,3.6vw,1.2rem);padding:1.1rem 2rem;max-width:92vw;text-align:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.rv{opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity 1.3s,transform 1.3s,filter 1.3s;transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none;filter:none}
@keyframes rise{from{opacity:0;filter:blur(12px);transform:translateY(16px);letter-spacing:.3em}to{opacity:1;filter:none;transform:none}}
/* hoa hồng vector */
.rose{display:block;aspect-ratio:1}.rose svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 16px rgba(235,161,194,.4));animation:breathe 5s ease-in-out infinite alternate}
@keyframes breathe{to{filter:drop-shadow(0 0 30px rgba(235,161,194,.7))}}
.pt{transform-box:view-box;transform-origin:100px 100px;transform:scale(.15);opacity:.2;transition:transform 1.7s cubic-bezier(.2,.8,.2,1) var(--i),opacity 1.7s var(--i)}
.rose.open .pt{transform:scale(1);opacity:1}
/* chương 0 (nền trong suốt để thấy sao/hạt phía sau) */
#intro{position:fixed;inset:0;z-index:20;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:max(20px,env(safe-area-inset-top)) 6vw max(20px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 38%,rgba(157,112,206,.28),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(74,23,53,.8),transparent 60%);transition:opacity 1.2s}
#intro.gone{opacity:0;pointer-events:none}
#intro>*{animation:rise 1.8s both;animation-delay:var(--d,0s)}
#intro h1{font-size:clamp(2.3rem,10.5vw,6rem);line-height:1.05;color:var(--st);animation-duration:2.4s}
#intro .sub{font:italic 500 clamp(1.1rem,3.4vw,1.5rem)/1.4 var(--disp);color:var(--ch);max-width:26ch}
.date{letter-spacing:.4em;font-size:.8rem;color:var(--gold)}
.stage{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:.6rem 0}
.env{position:absolute;left:-12%;right:-12%;bottom:0;height:58%;background:linear-gradient(160deg,#2a1030,var(--bu));border:1px solid rgba(235,161,194,.35);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(157,112,206,.2)}
.flap{position:absolute;inset:0 0 auto;height:100%;background:linear-gradient(#5a1d44,#3a1430);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s .2s}
.env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:78%;translate:-50% -50%;width:34px;height:34px;border-radius:50%;background:#7a2150;color:var(--rose);display:grid;place-items:center;font-style:normal;box-shadow:0 0 18px rgba(235,161,194,.5);transition:opacity .6s}.env.open .seal{opacity:0}
.stage .rose{position:absolute;left:12%;right:12%;top:-14%}
/* các chương (nền bán trong suốt) */
main{position:relative;z-index:1}
.ch{min-height:100svh;padding:14vh 7vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.6rem;position:relative}
.c1{background:radial-gradient(ellipse at 50% 30%,rgba(157,112,206,.22),transparent 60%),linear-gradient(rgba(8,6,11,0),rgba(28,16,37,.65))}
.c2{padding:8vh 5vw 12vh;background:radial-gradient(ellipse at 50% 50%,rgba(74,23,53,.6),transparent 70%),linear-gradient(rgba(28,16,37,.65),rgba(8,6,11,0))}
.c3{background:radial-gradient(ellipse at 50% 72%,rgba(230,205,163,.16),transparent 55%),linear-gradient(rgba(8,6,11,0),rgba(74,23,53,.7) 40%,rgba(42,16,48,.7) 78%,rgba(8,6,11,0))}
.c4{background:linear-gradient(transparent,rgba(28,16,37,.6) 50%,transparent)}
.c5{background:radial-gradient(ellipse at 15% 30%,rgba(157,112,206,.16),transparent 55%)}
.c6{background:radial-gradient(ellipse at 50% 50%,rgba(157,112,206,.22),rgba(28,16,37,.6) 65%,transparent)}
.c7{background:radial-gradient(ellipse at 50% 40%,rgba(235,161,194,.1),transparent 60%)}
.c9{background:radial-gradient(ellipse at 50% 60%,rgba(74,23,53,.6),transparent 75%)}
.orb{position:relative;width:min(80vw,340px);aspect-ratio:1;display:grid;place-items:center}
.orb svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 70s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.orb .name{font-size:clamp(2rem,8.5vw,3.2rem);position:relative;text-align:center;line-height:1.1}
/* thư (rất dài: mỗi đoạn hiện khi cuộn tới) */
.paper{width:min(100%,660px);padding:clamp(1.6rem,5vw,3.2rem);background:radial-gradient(circle at 15% 0,#fff8fb,transparent 60%),repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 1px,transparent 1px 3px),linear-gradient(160deg,#FBE8F0,#F2D3E2);color:#3a1830;border-radius:4px;text-align:left;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(248,221,231,.07);position:relative}
.paper h2{font-size:clamp(1.6rem,6vw,2.3rem);color:#7a2a58;margin-bottom:1rem;line-height:1.3}
.paper p{margin:0 0 1.1em;font-weight:400;line-height:1.85}
#letterBody p{opacity:0;filter:blur(6px);transform:translateY(8px);transition:opacity 1s,filter 1s,transform 1s}#letterBody p.in{opacity:1;filter:none;transform:none}
#letterBody p.tag{font:italic 500 1.2rem/1.5 var(--disp);color:#7a2a58}
#letterBody p.gr{font:500 1.6rem var(--hand);color:#7a2a58}
#letterBody p.fin{font-style:italic;color:#7a2a58;margin-bottom:.3em}
.sign{display:flex;align-items:center;gap:.8rem;justify-content:flex-end;font-size:1.8rem;color:#7a2a58;opacity:0;transition:opacity 1.2s;margin-top:1.4rem}.done .sign{opacity:1}
.stamp{width:34px;height:34px;border-radius:50%;background:#9c3f78;color:#FBE8F0;display:grid;place-items:center;font-size:.9rem;font-style:normal;transform:rotate(-12deg)}
.fp{position:absolute;right:1.2rem;bottom:4.5rem;width:16px;height:24px;border-radius:50% 0;background:var(--rose);opacity:0}.done .fp{animation:fall 3.5s ease-in forwards}
@keyframes fall{0%{opacity:.9;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(-30px,90px) rotate(200deg)}}
/* vườn */
.rosebtn{background:none;border:0;cursor:pointer;width:min(72vw,300px);border-radius:50%}
.wish{font:italic 500 clamp(1.2rem,3.4vw,1.7rem)/1.5 var(--disp);max-width:30ch;opacity:0;transition:opacity 2s 1s}.wish.in{opacity:1}.wish p,.secmsg p{margin:0}
.bouquet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:2rem;align-items:center;max-width:860px;margin-top:3rem;text-align:left}
.bouquet h3{font-size:clamp(1.7rem,5vw,2.3rem);color:var(--rose);margin-bottom:.8rem;line-height:1.2}.bouquet p{margin-bottom:.9em;color:var(--ch)}
.frame{aspect-ratio:3/4;padding:10px;background:rgba(248,221,231,.08);border:1px solid rgba(248,221,231,.3);rotate:-2deg;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.frame .media{padding:0;border:0;height:100%}.frame .rose{width:80%;margin:auto}
/* album (N ảnh theo CONFIG, bố cục lặp theo chu kỳ 5) */
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(.8rem,2vw,1.6rem);width:min(100%,1000px)}
.ph{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;position:relative;display:block;text-align:left;min-width:0}
.f0{grid-column:1/5;aspect-ratio:4/3;rotate:-1deg}.f1{grid-column:5/7;aspect-ratio:3/4;margin-top:3rem;rotate:1.5deg}.f2{grid-column:1/3;aspect-ratio:3/4;rotate:1deg}.f3{grid-column:3/7;aspect-ratio:16/10;margin-top:-1.5rem;rotate:-1.2deg}.f4{grid-column:2/6;aspect-ratio:16/9;rotate:.8deg}
.media{width:100%;height:100%;overflow:hidden;padding:6px;border:1px solid rgba(248,221,231,.28);background:rgba(248,221,231,.06);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.phold{height:100%;display:grid;place-content:center;justify-items:center;gap:.6rem;color:var(--rose);font-size:.85rem;padding:1rem;text-align:center;background:radial-gradient(circle,rgba(157,112,206,.22),transparent 70%)}.phold svg{width:44px;height:44px}
.cap{position:absolute;inset:auto 6px 6px;padding:1.8rem .8rem .6rem;font-size:.78rem;line-height:1.5;color:var(--ch);background:linear-gradient(transparent,rgba(8,6,11,.88))}
#lb{position:fixed;inset:0;z-index:50;background:rgba(8,6,11,.95);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#lb figure{text-align:center;max-width:900px;margin:auto;width:100%}
#lbImg{height:68svh;animation:rise .7s both}#lbImg .media{border:0;box-shadow:none;background:none;padding:0}#lbImg img{object-fit:contain}
#lb figcaption{margin-top:.8rem;color:var(--ch);font-style:italic}.dots2{display:flex;gap:8px;justify-content:center;margin-top:.6rem}.dots2 i{width:8px;height:8px;border-radius:50%;background:rgba(248,221,231,.3)}.dots2 i.on{background:var(--rose)}
.rb{width:48px;height:48px;border-radius:50%;border:1px solid rgba(235,161,194,.5);background:rgba(28,16,37,.8);color:var(--st);font-size:1.4rem;cursor:pointer}
#lbClose{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:2}
/* điều nhỏ bé */
.things{display:grid;gap:clamp(3rem,9vw,6rem);margin-top:2rem;width:min(100%,860px)}
.thing{display:flex;align-items:center;gap:2rem;text-align:left}.thing:nth-child(even){flex-direction:row-reverse}
.thing .vis{flex:0 0 auto;position:relative;width:clamp(110px,26vw,200px);text-align:center}
.num{font:italic 500 clamp(4rem,15vw,8rem)/1 var(--disp);color:transparent;-webkit-text-stroke:1px rgba(235,161,194,.5)}
.vis svg{position:absolute;inset:0;margin:auto;width:60%;color:var(--rose)}
.thing h3{font:600 .8rem var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem}.thing p{color:var(--ch)}
/* chòm sao */
.const{position:relative;width:min(100%,520px)}.const svg{width:100%;height:auto;display:block;overflow:visible}
.cpts circle{fill:var(--ch);opacity:.45;transform:translate(var(--dx),var(--dy));transition:transform 2s cubic-bezier(.2,.8,.2,1),opacity 2s}.cpts.on circle{transform:none;opacity:1}
.cl{fill:none;stroke:var(--rose);stroke-width:1;opacity:0;transition:opacity 2s .8s}.on .cl{opacity:.6}
.nl{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 2.2s .4s}.on .nl{stroke-dashoffset:0}
.const text{font-family:var(--disp);font-weight:600;fill:var(--st);font-size:15px;letter-spacing:2px}
.heartbtn{position:absolute;left:50%;top:43%;translate:-50% -50%;width:64px;height:64px;border-radius:50%;border:1px solid rgba(235,161,194,.7);background:rgba(28,16,37,.55);color:var(--rose);font-size:1.7rem;cursor:pointer;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1);box-shadow:0 0 28px rgba(235,161,194,.5)}}
.lh{font:italic 600 clamp(1.5rem,6vw,3rem) var(--disp);letter-spacing:.12em;color:var(--gold)}
.reveal{max-width:32ch;font:italic 500 clamp(1.1rem,3vw,1.5rem)/1.6 var(--disp);color:var(--ch);opacity:0;transition:opacity 1.8s 1.2s;min-height:5em}.reveal.in{opacity:1}
/* thư nhỏ, bí mật, kết */
.mini{width:96px;height:96px;border-radius:50%;border:1px solid rgba(235,161,194,.5);background:rgba(74,23,53,.35);color:var(--rose);font-size:2.4rem;cursor:pointer;transition:transform .3s}.mini:hover{transform:translateY(-3px)}
.paper.s{width:min(100%,520px)}
.keybtn{width:76px;height:76px;border-radius:50%;border:1px solid rgba(157,112,206,.6);background:rgba(157,112,206,.12);color:var(--ch);cursor:pointer;display:grid;place-items:center}.keybtn svg{width:42px;height:42px}
.secmsg{max-width:34ch;font:italic 500 clamp(1.1rem,3vw,1.5rem)/1.6 var(--disp);color:var(--ch);opacity:0;transition:opacity 1.6s}.secmsg.open{opacity:1}
.note{position:fixed;left:-8vw;z-index:2;color:var(--rose);font-size:1.8rem;pointer-events:none;animation:fly 4.5s linear forwards}@keyframes fly{to{transform:translate(115vw,-50px) rotate(25deg);opacity:.3}}
#after{display:flex;flex-direction:column;align-items:center;gap:1.1rem;margin-top:1rem}
.msg{opacity:0;transform:translateY(14px);transition:opacity 1.6s,transform 1.6s;max-width:30ch}.msg.in{opacity:1;transform:none}
.msg.m1{font:italic 600 clamp(1.5rem,5vw,2.2rem) var(--disp);color:var(--rose)}.msg.m2{color:var(--ch)}
.bloom{position:relative;display:grid;place-items:center;min-height:min(80vw,300px);width:100%;max-width:none}
.bloom .rose{position:absolute;width:min(80vw,300px);opacity:.85}.bloom .names{position:relative;font:italic 600 clamp(1.6rem,7vw,3.2rem) var(--disp);letter-spacing:.06em;text-shadow:0 2px 24px #08060B}
.row{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;max-width:none}
/* UI cố định */
#player{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:60;display:flex;gap:8px;align-items:center;padding:5px 12px 5px 5px;border-radius:99px;background:rgba(28,16,37,.8);border:1px solid rgba(235,161,194,.3);backdrop-filter:blur(8px)}
#mBtn{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(120deg,var(--rose),var(--am));color:#1C1025;font-size:1.1rem;cursor:pointer}#vol{width:64px;accent-color:var(--rose)}
#player.off{opacity:.55}
#dots{position:fixed;right:14px;top:50%;translate:0 -50%;z-index:30;display:flex;flex-direction:column;gap:12px}#dots a{width:8px;height:8px;border-radius:50%;background:rgba(248,221,231,.3);transition:.3s}#dots a.on{background:var(--rose);transform:scale(1.5)}
@media(max-width:700px){#dots{display:none}.bouquet{grid-template-columns:1fr}.frame{max-width:300px;margin:auto}
.gal{grid-template-columns:1fr 1fr}.f0,.f3,.f4{grid-column:1/3;margin-top:0}.f1,.f2{grid-column:auto;margin-top:0}.f3,.f4{aspect-ratio:4/3}
.thing,.thing:nth-child(even){flex-direction:column;text-align:center}#lb{grid-template-columns:40px minmax(0,1fr) 40px}.rb{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas><div id="dim" aria-hidden="true"></div><div id="bar"></div>

<section id="intro" aria-label="Lời mời">
  <p class="date" data-t="date"></p>
  <h1 class="disp" data-t="receiverUp" style="--d:.4s"></h1>
  <p class="sub" data-t="introSub" style="--d:1.4s"></p>
  <div class="stage" style="--d:2s"><div class="env" id="env"><div class="flap"></div><i class="seal">♥</i></div><div class="rose" id="roseIntro"></div></div>
  <button class="btn" id="openBtn" style="--d:2.6s" data-t="openBtn"></button>
  <p class="small" style="--d:2.8s" data-t="openHint"></p>
  <p class="hand" style="--d:3s;color:var(--ch)" data-t="introFrom"></p>
</section>

<main id="main" hidden>
<section class="ch c1" id="ch1" data-ch="Vũ trụ của em">
  <h2 class="big rv" data-t="c1h"></h2>
  <p class="lead rv" style="--d:.9s" data-t="c1sub"></p>
  <div class="orb rv" style="--d:1.4s"><svg viewBox="0 0 300 300" aria-hidden="true" fill="none" stroke="rgba(235,161,194,.35)"><ellipse cx="150" cy="150" rx="140" ry="60" transform="rotate(25 150 150)"/><ellipse cx="150" cy="150" rx="110" ry="110" stroke-dasharray="2 8"/><ellipse cx="150" cy="150" rx="130" ry="45" transform="rotate(-40 150 150)"/><g fill="#FFF6FB" stroke="none"><circle cx="30" cy="110" r="2.5"/><circle cx="250" cy="60" r="2"/><circle cx="260" cy="210" r="3"/><circle cx="90" cy="260" r="2"/><circle cx="150" cy="10" r="2"/></g></svg><span class="disp name" data-t="receiver"></span></div>
  <p class="para rv" data-t="c1lead"></p>
  <a class="btn ghost" href="#ch2" data-t="c1btn"></a>
</section>

<section class="ch c2" id="ch2" data-ch="Lá thư">
  <button class="btn ghost" id="skipLetter" data-t="skip"></button>
  <article class="paper" id="paper"><span class="fp"></span><h2 class="hand" data-t="c2h"></h2><div id="letterBody"></div><div class="sign"><span class="hand" data-t="sign"></span><i class="stamp">♥</i></div></article>
</section>

<section class="ch c3" id="ch3" data-ch="Khu vườn">
  <h2 class="big rv" data-t="c3h"></h2>
  <button class="rosebtn rv" id="gardenBtn" aria-expanded="false" aria-label="Chạm vào đóa hoa để hé nở"><span class="rose"></span></button>
  <p class="small" data-t="c3tap"></p>
  <div class="wish" id="wish" data-p="wish"></div>
  <div class="bouquet rv"><div class="frame" id="bqFrame"></div><div><h3 class="hand" data-t="bqH"></h3><div data-p="bouquet"></div></div></div>
</section>

<section class="ch c4" id="ch4" data-ch="Album">
  <h2 class="big rv" data-t="c4h"></h2><p class="lead rv" data-t="c4lead"></p><div class="gal" id="gal"></div>
</section>

<section class="ch c5" id="ch5" data-ch="Điều nhỏ bé">
  <h2 class="big rv" data-t="c5h"></h2><p class="lead rv" data-t="c5lead"></p><div class="things" id="things"></div>
</section>

<section class="ch c6" id="ch6" data-ch="Chòm sao">
  <p class="small" data-t="c6k"></p>
  <div class="const rv" id="const"><svg viewBox="0 0 400 300" role="img" aria-label="Chòm sao hình trái tim giữa hai cái tên"><path class="nl" d="M98 128C140 50 230 50 266 128"/><g class="cpts" id="cpts"></g><text x="62" y="136" text-anchor="middle" id="nA"></text><text x="330" y="136" text-anchor="middle" id="nB"></text></svg>

  if(p.t==="h")heart(cx,p.s);
  else if(p.t==="p"){cx.beginPath();cx.ellipse(0,0,p.s*.5,p.s*.28,0,0,7);cx.fill()}
  else if(p.t==="s"){const k=p.s*.6;cx.beginPath();cx.moveTo(0,-k);cx.quadraticCurveTo(0,0,k,0);cx.quadraticCurveTo(0,0,0,k);cx.quadraticCurveTo(0,0,-k,0);cx.quadraticCurveTo(0,0,0,-k);cx.fill()}
  else{cx.beginPath();cx.arc(0,0,p.s*.25,0,7);cx.fill()}cx.restore()}
function frame(t){cx.clearRect(0,0,w,h);cx.fillStyle="#FFF6FB";
  for(const s of stars){cx.globalAlpha=(.2+.55*Math.abs(Math.sin(t/1800*s.sp+s.ph)))*calm;cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()}
  cx.fillStyle="#EBA1C2";
  for(const p of petals){p.y+=p.vy*calm;p.x+=p.vx+Math.sin(p.y/60)*.2;p.r+=p.vr;if(p.y>h+20){p.y=-20;p.x=Math.random()*w}
    cx.globalAlpha=.4*calm;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.beginPath();cx.ellipse(0,0,p.s*.5,p.s*.28,0,0,7);cx.fill();cx.restore()}
  for(let i=fxs.length-1;i>=0;i--){const p=fxs[i];
    if(p.g){p.x+=(p.g[0]-p.x)*.07;p.y+=(p.g[1]-p.y)*.07}else{p.vx*=.985;p.vy=p.vy*.985+p.gr;p.x+=p.vx;p.y+=p.vy}
    p.r+=p.vr;if(--p.life<=0){fxs.splice(i,1);continue}drawFx(p)}
  cx.globalAlpha=1}
function loop(t){raf=requestAnimationFrame(loop);frame(t)}
function startLoop(){cancelAnimationFrame(raf);if(!RM&&!document.hidden)raf=requestAnimationFrame(loop)}
document.addEventListener("visibilitychange",startLoop);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(seed,200)});
function burst(x,y,n,o={}){if(RM)return;n=Math.round(n*(isSmall()?.6:1));
  for(let i=0;i<n;i++){const L=i%3,a=Math.random()*6.283,v=(1.5+Math.random()*5)*(L?1:.5)*(o.soft?.5:1);
    fxs.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,gr:.03+L*.01,r:Math.random()*6,vr:(Math.random()-.5)*.1,t:o.petals?"p":"hpsd"[Math.random()*4|0],
      s:(L==0?6:L==1?12:20)*(.7+Math.random()*.6),c:PAL[Math.random()*PAL.length|0],a:L==0?.6:.95,life:80+Math.random()*90|0})}
  if(fxs.length>450)fxs.splice(0,fxs.length-450)}
function gatherHeart(x,y){if(RM)return;
  for(let i=0;i<26;i++){const a=i/26*6.283,d=90+Math.random()*60;fxs.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,g:[x,y],r:0,vr:0,t:"d",s:14,c:PAL[i%5],a:1,life:70})}
  setTimeout(()=>fxs.push({x,y,vx:0,vy:-.3,gr:0,r:0,vr:0,t:"h",s:46,c:"#EBA1C2",a:1,life:90}),900)}
const center=e=>{const b=e.getBoundingClientRect();return[b.left+b.width/2,b.top+b.height/2]};

/* ============ NHẠC (tùy chọn, lỗi thì bỏ qua) ============ */
const audio=new Audio(),vol=$("#vol"),mBtn=$("#mBtn");let duck=1,fadeT,musicOK=true;
audio.loop=true;audio.preload="none";audio.src=CONFIG.musicSrc;
audio.addEventListener("error",()=>{musicOK=false;$("#player").classList.add("off");mBtn.setAttribute("aria-pressed","false")});
audio.addEventListener("play",()=>{mBtn.textContent="❚❚";mBtn.setAttribute("aria-pressed","true")});
audio.addEventListener("pause",()=>{mBtn.textContent="♪";mBtn.setAttribute("aria-pressed","false")});
function target(){return Math.min(1,vol.value*duck)}
function fadeTo(v){clearInterval(fadeT);fadeT=setInterval(()=>{const d=v-audio.volume;if(Math.abs(d)<.03){audio.volume=v;clearInterval(fadeT)}else audio.volume=Math.min(1,Math.max(0,audio.volume+Math.sign(d)*.03))},100)}
function playMusic(){if(!musicOK)return;audio.volume=0;const p=audio.play();if(p&&p.then)p.then(()=>fadeTo(target())).catch(()=>{})}
mBtn.onclick=()=>{if(audio.paused)playMusic();else audio.pause()};
vol.oninput=()=>{clearInterval(fadeT);audio.volume=target()};

/* ============ MỞ QUÀ ============ */
let opened=false;
function openGift(){if(opened)return;opened=true;$("#env").classList.add("open");const[x,y]=center($("#env"));burst(x,y-40,45,{petals:true});playMusic();
  wait(()=>{$("#intro").classList.add("gone");$("#main").hidden=false;scrollTo(0,0);setTimeout(()=>{if(opened)$("#intro").hidden=true},1300)},1600)}
$("#openBtn").onclick=openGift;
wait(()=>$("#roseIntro").classList.add("open"),1200);

/* ============ HIỆN DẦN KHI CUỘN / TIẾN TRÌNH CHƯƠNG ============ */
const rvIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");rvIO.unobserve(e.target)}}),{threshold:.15});
function observeAll(){$$(".rv:not(.in)").forEach(e=>rvIO.observe(e))}
const chs=$$("#main .ch");
chs.forEach(s=>{const a=document.createElement("a");a.href="#"+s.id;a.title=s.dataset.ch;a.setAttribute("aria-label",s.dataset.ch);$("#dots").append(a)});
// dùng "vạch giữa màn hình" để chương rất dài (lá thư) vẫn được nhận diện
const chIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$("#dots a").forEach((a,i)=>a.classList.toggle("on",chs[i]===e.target));
  const fin=e.target.id==="ch9";calm=fin?.45:1;duck=fin?.6:1;if(!audio.paused)fadeTo(target())}}),{rootMargin:"-45% 0px -45% 0px"});
chs.forEach(s=>chIO.observe(s));
addEventListener("scroll",()=>{const m=document.documentElement;$("#bar").style.width=(scrollY/Math.max(1,m.scrollHeight-innerHeight)*100)+"%"},{passive:true});

/* ============ LÁ THƯ (nguyên văn; mỗi đoạn hiện khi cuộn tới) ============ */
let letterDone=false;
const letterIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");letterIO.unobserve(e.target);
  if(e.target===$("#letterBody").lastElementChild)finishLetter()}),{rootMargin:"0px 0px -12% 0px"});
function buildLetter(){const b=$("#letterBody");letterIO.disconnect();b.innerHTML="";
  LET.forEach((s,i)=>{const p=document.createElement("p");p.textContent=s;
    if(i===0)p.className="tag";else if(s.startsWith("Dear "))p.className="gr";else if(i>=LET.length-3)p.className="fin";
    b.append(p);letterIO.observe(p)});
  letterDone=false;$("#paper").classList.remove("done")}
function finishLetter(){if(letterDone)return;letterDone=true;$("#paper").classList.add("done")}
function skipLetter(){letterIO.disconnect();$$("#letterBody p").forEach(p=>p.classList.add("in"));finishLetter()}
$("#skipLetter").onclick=skipLetter;

/* ============ KHU VƯỜN & HOA ============ */
$("#gardenBtn").onclick=function(){const r=$(".rose",this),on=!r.classList.contains("open");r.classList.toggle("open",on);this.setAttribute("aria-expanded",on);
  $("#wish").classList.toggle("in",on);if(on){const[x,y]=center(this);burst(x,y,26,{petals:true,soft:true})}};
function media(p,eager){const d=document.createElement("div");d.className="media";const im=new Image();im.alt=p.alt||p.caption||"";if(!eager)im.loading="lazy";
  im.onerror=()=>{d.innerHTML="<div class=\"phold\">"+flowerIcon()+"<span>"+T.phText+"</span></div>"};im.src=p.src;d.append(im);return d}
(function(){const f=$("#bqFrame"),m=media({src:CONFIG.flowersSrc,alt:"Hoa dành tặng "+CONFIG.receiverName});
  m.querySelector("img").onerror=()=>{m.innerHTML='<div class="rose open"></div>';$(".rose",m).innerHTML=roseSVG()};f.append(m)})();

/* ============ ALBUM + LIGHTBOX (số ảnh lấy từ CONFIG.photos) ============ */
const lb=$("#lb");let li=0,lbFrom=null;const NP=CONFIG.photos.length;
CONFIG.photos.forEach((p,i)=>{const b=document.createElement("button");b.className="ph f"+(i%5)+" rv";b.setAttribute("aria-label","Xem ảnh lớn: "+p.caption);
  const c=document.createElement("span");c.className="cap";c.textContent=p.caption;b.append(media(p),c);b.onclick=()=>openLB(i);$("#gal").append(b);
  $("#lbDots").append(document.createElement("i"))});
function showLB(){const p=CONFIG.photos[li],box=$("#lbImg");box.replaceChildren(media(p,true));box.style.animation="none";void box.offsetWidth;box.style.animation="";
  $("#lbCap").textContent=p.caption;$$("#lbDots i").forEach((d,i)=>d.classList.toggle("on",i===li))}
function openLB(i){li=i;lbFrom=document.activeElement;lb.hidden=false;document.body.classList.add("noscroll");showLB();$("#lbClose").focus()}
function closeLB(){lb.hidden=true;document.body.classList.remove("noscroll");if(lbFrom)lbFrom.focus()}
function stepLB(d){li=(li+d+NP)%NP;showLB()}
$("#lbClose").onclick=closeLB;$("#lbPrev").onclick=()=>stepLB(-1);$("#lbNext").onclick=()=>stepLB(1);
lb.addEventListener("click",e=>{if(e.target===lb)closeLB()});
addEventListener("keydown",e=>{if(lb.hidden)return;if(e.key==="Escape")closeLB();else if(e.key==="ArrowLeft")stepLB(-1);else if(e.key==="ArrowRight")stepLB(1)});
let tx=0;lb.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)stepLB(d<0?1:-1)},{passive:true});

/* ============ NHỮNG ĐIỀU ANH MUỐN EM NHỚ (trích nguyên văn từ thư) ============ */
CONFIG.things.forEach((t,i)=>{const d=document.createElement("article");d.className="thing rv";
  d.innerHTML="<div class=\"vis\"><div class=\"num\">0"+(i+1)+"</div>"+ICONS[t.icon]+"</div><div><h3></h3><p></p></div>";$("h3",d).textContent=t.title;$("p",d).textContent=q(t.text);$("#things").append(d)});

/* ============ CHÒM SAO ============ */
(function(){const g=$("#cpts"),pts=[];
  for(let i=0;i<36;i++){const t=i/36*6.2832,x=200+3.6*16*Math.pow(Math.sin(t),3),y=118-3.6*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));pts.push([x,y]);
    const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x.toFixed(1));c.setAttribute("cy",y.toFixed(1));c.setAttribute("r",i%4?2:3);
    c.style.setProperty("--dx",(Math.random()*320-160).toFixed(0)+"px");c.style.setProperty("--dy",(Math.random()*240-120).toFixed(0)+"px");g.append(c)}
  const l=document.createElementNS(NS,"path");l.setAttribute("class","cl");l.setAttribute("d","M"+pts.map(p=>p.map(n=>n.toFixed(1)).join(" ")).join("L")+"Z");g.parentNode.insertBefore(l,g)})();
$("#heartBtn").onclick=function(){const on=!$("#const").classList.contains("on");$("#const").classList.toggle("on",on);$("#cpts").classList.toggle("on",on);$("#cMsg").classList.toggle("in",on);
  if(on){const[x,y]=center(this);burst(x,y,22,{soft:true})}};

/* ============ THƯ "MỞ KHI CẦN ĐƯỢC VỖ VỀ" ============ */
$("#hugEnv").onclick=function(){const L=$("#hugLetter"),open=L.hidden;L.hidden=!open;$("#hugGot").hidden=!open;this.setAttribute("aria-expanded",open);
  if(open)L.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"})};
$("#hugGot").onclick=function(){const[x,y]=center(this);gatherHeart(x,y)};

/* ============ VƯỜN BÍ MẬT (EASTER EGG) ============ */
let secLock=false,piano=null;
$("#secBtn").onclick=function(){$("#secMsg").classList.add("open");if(secLock)return;secLock=true;setTimeout(()=>secLock=false,2500);
  if(!RM)for(let i=0;i<8;i++){const n=document.createElement("span");n.className="note";n.textContent="♪♫♩♬"[i%4];n.style.top=(15+Math.random()*65)+"vh";n.style.animationDelay=(i*.3)+"s";n.setAttribute("aria-hidden","true");
    n.addEventListener("animationend",()=>n.remove());document.body.append(n)}
  try{if(piano){piano.pause();piano.currentTime=0}piano=new Audio(CONFIG.pianoSrc);piano.volume=.6;const p=piano.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}};

/* ============ CÁI ÔM CUỐI ============ */
let hugged=false,hugLock=false,hugT=[];
function doHug(){if(hugLock)return;hugLock=true;setTimeout(()=>hugLock=false,700);
  const btn=$("#hug"),[x,y]=center(hugged?$("#hug2"):btn);
  if(hugged){burst(x,y,90);return}
  hugged=true;const dim=$("#dim");dim.classList.add("on");
  const at=(f,ms)=>hugT.push(wait(f,ms)),ms=$$("#after .msg");
  at(()=>{dim.classList.remove("on");burst(x,y,40,{soft:true})},500);       // giai đoạn 1: tĩnh lặng
  at(()=>{[0,1,2].forEach(k=>burst(x,y,70))},900);                          // giai đoạn 2: supernova nhiều lớp
  $("#after").hidden=false;at(()=>$("#after").scrollIntoView({behavior:RM?"auto":"smooth",block:"center"}),400);
  [0,1,2,3,4].forEach((k,i)=>at(()=>ms[k].classList.add("in"),1000+i*1500));  // giai đoạn 3: lời nhắn
  at(()=>{$("#roseFinal").classList.add("open");ms[5].classList.add("in");burst(innerWidth/2,0,30,{petals:true})},8000); // giai đoạn 4: hoa cuối
  at(()=>ms[6].classList.add("in"),9500)}
$("#hug").onclick=doHug;$("#hug2").onclick=doHug;
$("#replay").onclick=function(){
  hugT.forEach(clearTimeout);hugT=[];hugged=false;fxs=[];calm=1;duck=1;if(piano)piano.pause();
  $("#after").hidden=true;$$("#after .in").forEach(e=>e.classList.remove("in"));
  $$(".open,.on,.in").forEach(e=>{if(!e.closest("#intro")&&e.id!=="player")e.classList.remove("open","on","in")});
  $("#hugLetter").hidden=true;$("#hugGot").hidden=true;$("#hugEnv").setAttribute("aria-expanded","false");$("#gardenBtn").setAttribute("aria-expanded","false");
  buildLetter();$("#env").classList.remove("open");$("#roseIntro").classList.remove("open");
  $("#main").hidden=true;$("#intro").hidden=false;void $("#intro").offsetWidth;$("#intro").classList.remove("gone");opened=false;scrollTo(0,0);
  wait(()=>$("#roseIntro").classList.add("open"),800)};

/* ============ KHỞI ĐỘNG ============ */
buildLetter();seed();startLoop();
new MutationObserver(observeAll).observe($("#main"),{attributes:true,attributeFilter:["hidden"]});observeAll();
</script>
</body>
</html>
